name: Downstream Integration Test

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cmake-fetchcontent:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: CMake FetchContent
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}

    - name: Cache and install apt packages
      uses: awalsh128/cache-apt-pkgs-action@v1.5.3
      with:
        packages: gfortran cmake ninja-build
        version: 1

    - name: Test CMake FetchContent integration
      run: |
        cd example/user_compilation_examples/cmake_project_template
        cmake -S . -B build -G Ninja \
          -DFORTPLOT_FETCH_SOURCE_DIR="${GITHUB_WORKSPACE}"
        cmake --build build
        ./build/bin/fortplot_demo

    - name: Verify CMake demo outputs
      run: |
        cd example/user_compilation_examples/cmake_project_template
        ls -la cmake_*.png cmake_*.pdf cmake_*.txt

  fpm-dependency:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: FPM Dependency
    runs-on: [self-hosted, itp-ubuntu24]
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}

    - name: Cache and install apt packages
      uses: awalsh128/cache-apt-pkgs-action@v1.5.3
      with:
        packages: gfortran
        version: 1

    - name: Cache FPM binary
      id: fpm_cache
      uses: actions/cache@v5
      with:
        path: /usr/local/bin/fpm
        key: ${{ runner.os }}-fpm-0.12.0-x86_64-gcc-12
        restore-keys: |
          ${{ runner.os }}-fpm-0.12.0-

    - name: Install FPM
      if: steps.fpm_cache.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        wget --timeout=30 https://github.com/fortran-lang/fpm/releases/download/v0.12.0/fpm-0.12.0-linux-x86_64-gcc-12 \
          && chmod +x fpm-0.12.0-linux-x86_64-gcc-12 \
          && sudo mv fpm-0.12.0-linux-x86_64-gcc-12 /usr/local/bin/fpm \
          && fpm --version || exit 1

    - name: Test FPM dependency integration
      run: |
        cd example/user_compilation_examples/fpm_project_template
        fpm build
        fpm run fpm_template_demo

    - name: Verify FPM demo outputs
      run: |
        cd example/user_compilation_examples/fpm_project_template
        ls -la fpm_*.png fpm_*.pdf fpm_*.txt
