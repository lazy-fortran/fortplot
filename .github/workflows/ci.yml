# Tests run in the merge queue and at night, not on every push to a pull
# request. The merge queue builds one pull request per commit on top of the
# ones before it, so HEAD^ is the state it lands on and `fo test --since HEAD^`
# runs the cases it affects. The nightly run tests everything, slow cases
# included, and is skipped when main has not moved since the last green
# nightly run of less than a week ago. Everything runs in the gcc:16 image
# (GNU Fortran 16 on Debian), with the Debian packages that
# .github/ci/apt-packages lists, one per line.
name: ci
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Required by the main ruleset; skipped (and so passing) on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: gcc:16
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      FPM_VERSION: 0.13.0
      GIT_TERMINAL_PROMPT: 0
      MPLBACKEND: Agg
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Base packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build curl ca-certificates ccache jq python3 > /dev/null
          # The image installs GCC under /usr/local; tests that run with a
          # minimal PATH expect a distribution's /usr/bin.
          for t in gcc g++ gfortran cpp gcc-ar gcc-nm gcc-ranlib gcov; do
            ln -sf "/usr/local/bin/$t" "/usr/bin/$t"
          done
      - name: Skip a nightly run of an unchanged main
        id: stale
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" |
            jq -r '.workflow_runs[0] | "\(.head_sha) \(.created_at)"' 2>/dev/null || true)
          sha=${last%% *} when=${last#* }
          if [ "$sha" = "$GITHUB_SHA" ] && [ -n "$when" ] &&
            [ "$(date -d "$when" +%s)" -gt "$(date -d '7 days ago' +%s)" ]; then
            echo "main at $GITHUB_SHA passed the nightly run of $when; nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.stale.outputs.skip != '1'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Repository packages
        if: steps.stale.outputs.skip != '1' && hashFiles('.github/ci/apt-packages') != ''
        run: grep -v '^#' .github/ci/apt-packages | xargs apt-get install -y -qq --no-install-recommends > /dev/null
      - name: Places
        if: steps.stale.outputs.skip != '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          fo=$(git ls-remote https://github.com/lazy-fortran/fo.git refs/heads/main | cut -f1)
          test -n "$fo"
          echo "FO_COMMIT=$fo" >> "$GITHUB_ENV"
          echo "FO_TOOLS=$RUNNER_TOOL_CACHE/fo-$fo" >> "$GITHUB_ENV"
          echo "FO_CACHE_DIR=$RUNNER_TEMP/fo-cache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: fo cache
        if: steps.stale.outputs.skip != '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FO_TOOLS }}
          key: fo-gcc16-${{ env.FO_COMMIT }}-fpm-${{ env.FPM_VERSION }}
      - name: Build cache
        if: steps.stale.outputs.skip != '1'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.FO_CACHE_DIR }}
            ${{ env.CCACHE_DIR }}
            build/dependencies
          key: build-${{ env.FO_COMMIT }}-${{ hashFiles('fpm.toml', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ env.FO_COMMIT }}-${{ hashFiles('fpm.toml', 'CMakeLists.txt') }}-
            build-${{ env.FO_COMMIT }}-
      - name: fo
        if: steps.stale.outputs.skip != '1'
        run: |
          # fo at main, built once per commit with fpm's release binary of the
          # pinned checksum.
          if [ ! -x "$FO_TOOLS/bin/fo" ]; then
            mkdir -p "$FO_TOOLS/bin"
            curl -fsSL -o "$FO_TOOLS/bin/fpm" \
              "https://github.com/fortran-lang/fpm/releases/download/v$FPM_VERSION/fpm-$FPM_VERSION-linux-x86_64-gcc-12"
            echo "2e50a8649ac4136b9cf6b63c5d1b01adf26c02eedc18f32e16261c0ce655d46d  $FO_TOOLS/bin/fpm" | sha256sum -c -
            chmod +x "$FO_TOOLS/bin/fpm"
            git init --quiet "$RUNNER_TEMP/fo-src"
            git -C "$RUNNER_TEMP/fo-src" fetch --quiet --depth 1 https://github.com/lazy-fortran/fo.git "$FO_COMMIT"
            git -C "$RUNNER_TEMP/fo-src" checkout --quiet FETCH_HEAD
            (cd "$RUNNER_TEMP/fo-src" && "$FO_TOOLS/bin/fpm" install --profile release --prefix "$FO_TOOLS")
          fi
          echo "$FO_TOOLS/bin" >> "$GITHUB_PATH"
      - name: Check
        if: steps.stale.outputs.skip != '1'
        run: |
          # Tests of permission errors need a user that file modes bind, so
          # they do not run as the container's root.
          useradd -u 1001 -m ci 2> /dev/null || true
          chown -R ci "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          exec setpriv --reuid=ci --regid=ci --init-groups env HOME=/home/ci sh -euc '
            if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
              [ -f .github/ci/check ] && exec ./.github/ci/check
              fo build
              exec fo test --since HEAD^
            fi
            [ -f .github/ci/nightly ] && exec ./.github/ci/nightly
            [ -f .github/ci/verify ] && exec ./.github/ci/verify
            fo build
            FO_TEST_RERUN=1 exec fo test --all'
